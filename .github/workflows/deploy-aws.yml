name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'mcp-shopping' }}
  FRONTEND_DEPLOY_TARGET: ${{ vars.FRONTEND_DEPLOY_TARGET || 's3' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          set -euo pipefail
          if ! aws ecr describe-repositories --repository-names "${{ env.ECR_REPOSITORY }}" >/dev/null 2>&1; then
            aws ecr create-repository \
              --repository-name "${{ env.ECR_REPOSITORY }}" \
              --image-scanning-configuration scanOnPush=true
          fi

      - name: Validate frontend deploy configuration
        run: |
          set -euo pipefail
          case "${FRONTEND_DEPLOY_TARGET}" in
            ecs|s3|both)
              ;;
            *)
              echo "Unsupported FRONTEND_DEPLOY_TARGET=${FRONTEND_DEPLOY_TARGET}. Use one of: ecs, s3, both." >&2
              exit 1
              ;;
          esac

          if [[ "${FRONTEND_DEPLOY_TARGET}" == "s3" || "${FRONTEND_DEPLOY_TARGET}" == "both" ]]; then
            if [[ -z "${{ vars.S3_FRONTEND_BUCKET }}" ]]; then
              echo "FRONTEND_DEPLOY_TARGET=${FRONTEND_DEPLOY_TARGET} requires repository variable S3_FRONTEND_BUCKET." >&2
              exit 1
            fi
            if [[ -z "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" ]]; then
              echo "FRONTEND_DEPLOY_TARGET=${FRONTEND_DEPLOY_TARGET} requires CLOUDFRONT_DISTRIBUTION_ID (invalidate after sync)." >&2
              exit 1
            fi
          fi

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${FRONTEND_DEPLOY_TARGET}" = "s3" ]; then
            TARGET="runtime-api"
          else
            TARGET="runtime-full"
          fi
          docker build --target "$TARGET" -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

      - name: Set up Node.js
        if: ${{ env.FRONTEND_DEPLOY_TARGET == 's3' || env.FRONTEND_DEPLOY_TARGET == 'both' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Angular and sync to S3
        if: ${{ env.FRONTEND_DEPLOY_TARGET == 's3' || env.FRONTEND_DEPLOY_TARGET == 'both' }}
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          npm run build -- --configuration=production
          aws s3 sync dist/frontend/browser/ "s3://${{ vars.S3_FRONTEND_BUCKET }}/" --delete

      - name: Invalidate CloudFront
        if: ${{ env.FRONTEND_DEPLOY_TARGET == 's3' || env.FRONTEND_DEPLOY_TARGET == 'both' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

      - name: Register task definition and update ECS service
        if: ${{ vars.ECS_CLUSTER != '' && vars.ECS_SERVICE != '' }}
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          OPENROUTER_API_KEY_SECRET_ARN: ${{ secrets.OPENROUTER_API_KEY_SECRET_ARN }}
          MCP_SERVER_URL: ${{ vars.MCP_SERVER_URL }}
          ECS_TARGET_GROUP_ARN: ${{ vars.ECS_TARGET_GROUP_ARN }}
          ECS_HEALTH_CHECK_GRACE_PERIOD: ${{ vars.ECS_HEALTH_CHECK_GRACE_PERIOD }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          sed \
            -e "s/ACCOUNT_PLACEHOLDER/${ACCOUNT_ID}/g" \
            -e "s/REGION_PLACEHOLDER/${AWS_REGION}/g" \
            deploy/ecs-task-definition.json > /tmp/ecs-task-sed.json
          cp /tmp/ecs-task-sed.json /tmp/ecs-work.json
          jq --arg IMAGE "$IMAGE_URI" '.containerDefinitions[0].image = $IMAGE' /tmp/ecs-work.json > /tmp/ecs-task.json
          mv /tmp/ecs-task.json /tmp/ecs-work.json
          if [ -n "${OPENROUTER_API_KEY_SECRET_ARN:-}" ]; then
            jq --arg SECRET_ARN "$OPENROUTER_API_KEY_SECRET_ARN" \
              '.containerDefinitions[0].secrets = [{"name":"OPENROUTER_API_KEY","valueFrom":$SECRET_ARN}]' \
              /tmp/ecs-work.json > /tmp/ecs-task.json
            mv /tmp/ecs-task.json /tmp/ecs-work.json
          fi
          if [ -n "${MCP_SERVER_URL:-}" ]; then
            jq --arg URL "$MCP_SERVER_URL" \
              '.containerDefinitions[0].environment = ((.containerDefinitions[0].environment // []) + [{"name":"MCP_SERVER_URL","value":$URL}])' \
              /tmp/ecs-work.json > /tmp/ecs-task.json
            mv /tmp/ecs-task.json /tmp/ecs-work.json
          fi
          NEW_ARN="$(aws ecs register-task-definition --cli-input-json file:///tmp/ecs-work.json --query taskDefinition.taskDefinitionArn --output text)"
          UPDATE_ARGS=()
          if [ -n "${ECS_TARGET_GROUP_ARN:-}" ]; then
            UPDATE_ARGS+=(--load-balancers "targetGroupArn=${ECS_TARGET_GROUP_ARN},containerName=app,containerPort=8000")
          fi
          if [ -n "${ECS_HEALTH_CHECK_GRACE_PERIOD:-}" ]; then
            UPDATE_ARGS+=(--health-check-grace-period-seconds "${ECS_HEALTH_CHECK_GRACE_PERIOD}")
          fi
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE }}" \
            --task-definition "$NEW_ARN" \
            --force-new-deployment \
            "${UPDATE_ARGS[@]}"

      - name: Deployment summary (frontend URL)
        if: success()
        run: |
          {
            echo "## Deploy"
            echo ""
            if [ "${FRONTEND_DEPLOY_TARGET}" = "ecs" ]; then
              echo "Single container: Angular + API on port **8000** (image target \`runtime-full\`)."
            elif [ "${FRONTEND_DEPLOY_TARGET}" = "s3" ]; then
              echo "**Split deploy:** Angular build → **S3** → **CloudFront**; API-only image (**\`runtime-api\`**) on **ECS** behind the ALB. Browsers use the same origin: CloudFront serves \`/\`, forwards \`/api/*\` to the ALB (see \`deploy/cloudformation-frontend-cloudfront.yaml\`)."
            else
              echo "**Both:** SPA synced to S3/CloudFront and container built with \`runtime-full\` (redundant unless you need both origins)."
            fi
            echo ""
            if [ -n "${{ vars.PUBLIC_APP_URL }}" ]; then
              echo "**Open the app in a browser:** [${{ vars.PUBLIC_APP_URL }}](${{ vars.PUBLIC_APP_URL }})"
            else
              if [ "${FRONTEND_DEPLOY_TARGET}" = "s3" ] || [ "${FRONTEND_DEPLOY_TARGET}" = "both" ]; then
                echo "Set \`PUBLIC_APP_URL\` to \`https://<DistributionDomainName>/\` (stack output \`DistributionDomainName\` from \`cloudformation-frontend-cloudfront.yaml\`)."
              else
                echo "Point your browser at your **internet-facing ALB URL** (HTTP port 80 → target group → tasks on 8000)."
                echo "Use the CloudFormation stack output \`BrowserUrl\` from \`deploy/cloudformation-public-alb.yaml\`, or your ALB DNS name."
                echo ""
                echo "Optional: add repository variable \`PUBLIC_APP_URL\` for a direct link in this summary next time."
              fi
            fi
            if [ -n "${{ vars.ECS_TARGET_GROUP_ARN }}" ]; then
              echo ""
              echo "ECS is updated with load balancer target group **${{ vars.ECS_TARGET_GROUP_ARN }}** (HTTP 80 → API on 8000)."
            fi
            if [ "${FRONTEND_DEPLOY_TARGET}" = "s3" ] || [ "${FRONTEND_DEPLOY_TARGET}" = "both" ]; then
              echo ""
              echo "Frontend deploy target: **${FRONTEND_DEPLOY_TARGET}**"
              echo "S3 bucket: \`${{ vars.S3_FRONTEND_BUCKET }}\`"
              echo "CloudFront distribution id: \`${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
