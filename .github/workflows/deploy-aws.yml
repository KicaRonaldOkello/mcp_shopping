# ECS deploy: the Docker image includes the Angular production build under /static/browser;
# FastAPI serves the SPA at / and the API under /api on port 8000. Your ALB listener should
# forward HTTP to that port — open the load balancer URL in a browser to use the UI.
# Optional: set repo variable PUBLIC_APP_URL (e.g. http://your-alb-dns.region.elb.amazonaws.com)
# so the summary below prints a direct link.
#
# Optional S3 + CloudFront steps: only use if CloudFront routes /api/* to the same backend;
# the Angular app calls relative /api paths (same-origin). Static-only S3 hosting breaks the API.

name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'mcp-shopping' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          set -euo pipefail
          if ! aws ecr describe-repositories --repository-names "${{ env.ECR_REPOSITORY }}" >/dev/null 2>&1; then
            aws ecr create-repository \
              --repository-name "${{ env.ECR_REPOSITORY }}" \
              --image-scanning-configuration scanOnPush=true
          fi

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

      - name: Set up Node.js
        if: ${{ vars.S3_FRONTEND_BUCKET != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Angular and sync to S3
        if: ${{ vars.S3_FRONTEND_BUCKET != '' }}
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          npm run build -- --configuration=production
          aws s3 sync dist/frontend/browser/ "s3://${{ vars.S3_FRONTEND_BUCKET }}/" --delete

      - name: Invalidate CloudFront
        if: ${{ vars.S3_FRONTEND_BUCKET != '' && vars.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

      - name: Register task definition and update ECS service
        if: ${{ vars.ECS_CLUSTER != '' && vars.ECS_SERVICE != '' }}
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          OPENROUTER_API_KEY_SECRET_ARN: ${{ secrets.OPENROUTER_API_KEY_SECRET_ARN }}
          MCP_SERVER_URL: ${{ vars.MCP_SERVER_URL }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          sed \
            -e "s/ACCOUNT_PLACEHOLDER/${ACCOUNT_ID}/g" \
            -e "s/REGION_PLACEHOLDER/${AWS_REGION}/g" \
            deploy/ecs-task-definition.json > /tmp/ecs-task-sed.json
          cp /tmp/ecs-task-sed.json /tmp/ecs-work.json
          jq --arg IMAGE "$IMAGE_URI" '.containerDefinitions[0].image = $IMAGE' /tmp/ecs-work.json > /tmp/ecs-task.json
          mv /tmp/ecs-task.json /tmp/ecs-work.json
          if [ -n "${OPENROUTER_API_KEY_SECRET_ARN:-}" ]; then
            jq --arg SECRET_ARN "$OPENROUTER_API_KEY_SECRET_ARN" \
              '.containerDefinitions[0].secrets = [{"name":"OPENROUTER_API_KEY","valueFrom":$SECRET_ARN}]' \
              /tmp/ecs-work.json > /tmp/ecs-task.json
            mv /tmp/ecs-task.json /tmp/ecs-work.json
          fi
          if [ -n "${MCP_SERVER_URL:-}" ]; then
            jq --arg URL "$MCP_SERVER_URL" \
              '.containerDefinitions[0].environment = ((.containerDefinitions[0].environment // []) + [{"name":"MCP_SERVER_URL","value":$URL}])' \
              /tmp/ecs-work.json > /tmp/ecs-task.json
            mv /tmp/ecs-task.json /tmp/ecs-work.json
          fi
          NEW_ARN="$(aws ecs register-task-definition --cli-input-json file:///tmp/ecs-work.json --query taskDefinition.taskDefinitionArn --output text)"
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE }}" \
            --task-definition "$NEW_ARN" \
            --force-new-deployment

      - name: Deployment summary (frontend URL)
        if: success()
        run: |
          {
            echo "## Deploy"
            echo ""
            echo "The running container serves **both** the Angular UI (paths like \`/\`) and the API (\`/api/...\`) on port **8000**."
            echo ""
            if [ -n "${{ vars.PUBLIC_APP_URL }}" ]; then
              echo "**Open the app in a browser:** [${{ vars.PUBLIC_APP_URL }}](${{ vars.PUBLIC_APP_URL }})"
            else
              echo "Point your browser at your **internet-facing ALB URL** (HTTP port 80 → target group → tasks on 8000)."
              echo "Use the CloudFormation stack output \`BrowserUrl\` from \`deploy/cloudformation-public-alb.yaml\`, or your ALB DNS name."
              echo ""
              echo "Optional: add repository variable \`PUBLIC_APP_URL\` (e.g. \`http://my-alb.us-east-1.elb.amazonaws.com\`) for a direct link in this summary next time."
            fi
            if [ -n "${{ vars.S3_FRONTEND_BUCKET }}" ]; then
              echo ""
              echo "S3/CloudFront: ensure CloudFront sends \`/api/*\` to the API origin; otherwise use the ALB URL above for same-origin API + UI."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
